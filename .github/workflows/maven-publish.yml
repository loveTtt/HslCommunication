name: Publish to Maven Central

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_TOKEN
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Publish GPG public key to keyservers
      run: |
        # setup-java 已把私钥导入 runner，从中提取 fingerprint 后推送公钥
        for KEY_ID in $(gpg --list-secret-keys --keyid-format=LONG | grep '^sec' | awk '{print $2}' | cut -d'/' -f2); do
          echo "Publishing key $KEY_ID to keyservers..."
          gpg --keyserver hkps://keyserver.ubuntu.com --send-keys "$KEY_ID" || true
          gpg --keyserver hkps://keys.openpgp.org --send-keys "$KEY_ID" || true
        done
        sleep 15  # 给 keyserver 一点时间同步索引

    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Publish to Maven Central
      run: mvn --batch-mode deploy
      env:
        CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        CENTRAL_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
